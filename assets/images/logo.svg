<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" fill="none">
  <!-- Brand typography "sokič" -->
  <text x="10" y="65" font-family="'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif" font-size="70" font-weight="900" fill="#1b4332" letter-spacing="-2px">
    sok<tspan dx="-2">i</tspan><tspan dx="1">č</tspan>
  </text>
  
  <!-- Stylized dual fresh leaves replacing / accenting the dot of the 'i' -->
  <g transform="translate(142, 12)">
    <!-- Leaf 1 (Left upwards) -->
    <path d="M 0 16 C -6 8, 2 0, 16 0 C 16 12, 10 18, 0 16 Z" fill="#22c55e" />
    <path d="M 0 16 Q 8 8 16 0" stroke="#15803d" stroke-width="1.2" fill="none" stroke-linecap="round" />
    
    <!-- Leaf 2 (Right tilted) -->
    <path d="M 10 17 C 12 7, 24 6, 28 14 C 22 21, 15 22, 10 17 Z" fill="#4ade80" />
    <path d="M 10 17 Q 19 14 28 14" stroke="#16a34a" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Caron/strešica on 'č' -->
  <path d="M 205 14 L 214 23 L 223 14" stroke="#1b4332" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Tiny natural dot accent -->
  <circle cx="240" cy="62" r="4.5" fill="#22c55e" />
</svg>
